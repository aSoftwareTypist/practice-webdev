    flex: 0 0 auto;

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const CHAPTERS = [
  {
    id: "express",
    title: "Express",
    roman: "I.",
    sections: ["Introduction", "The Core Parts Of Express", "The Mandatory Hello-World Program", "Summary"],
    content: `
<p>Express is a small web framework that runs on top of Node and itself is an intentionally barebones and unopinionated framework — meaning it allows us to do many things how we want, and to extend it with only the features we need. It helps to simplify the Node.js's web API functionality and add other features. It helps to organize web application through routing and middlewares.</p>

<p>Express adds two big features on top of Node.js HTTP server:</p>
<ul>
  <li>It adds an abstraction layer to a lot of complexity by providing a number of helpful functions or conveniences. Example: Sending a single JPEG file in raw Node.js requires extensive, performance-optimized code (~45 lines). In Express, this is reduced to a one-line <code>sendFile</code> method.</li>
  <li>It augments Node.js's capabilities with utilities like easier parsing of request URLs, direct access to the client's IP address, and simplified response methods.</li>
</ul>

<p>The flow of a request in an Express application involves several layers of modular functionality:</p>
<ol>
  <li>The client (browser or mobile app) sends a request to the server.</li>
  <li>The Node.js HTTP server receives the request and hands it to Express.</li>
  <li>Express processes the request through a middleware stack:
    <ul>
      <li>Middleware functions handle logging, parsing, or other general tasks.</li>
      <li>Specific route handlers respond to requests for particular URLs or endpoints.</li>
      <li>We add our custom-made middlewares such as controllers, validators, etc in the middleware stack.</li>
    </ul>
  </li>
  <li>Once processed, the response is sent back to the client.</li>
  <li>The response is sent through Node's HTTP server response by Express again.</li>
</ol>
<p>This layered, modular approach improves flexibility and readability compared to a single large request handler of Node's HTTP server.</p>

<h3 id="s-core-parts">The Core Parts Of Express</h3>
<p>An Express app at a high level has four main features:</p>

<h4>1. Routing</h4>
<p>Routing is a mechanism that maps requests to specific endpoints depending on their URL and HTTP methods. The client's requests are handled with a function that gets triggered only when we visit a specific URL with a specific HTTP method. For example, request <code>GET /</code> is mapped and returns the homepage through a middleware function.</p>

<h4>2. Middlewares</h4>
<p>Middlewares are the functions that handle processing of the server request and sending the desired response. They handle several tasks from logging of requests to setting static files and many more. Express has a middleware stack which is effectively an array of functions that handles requests.</p>

<h4>3. Sub-applications</h4>
<p>A sub-application is a combination of middlewares and routes helping us to achieve the task requested by the client. These are the subdivision of an Express application divided into different smaller apps such as handling APIs, rendering HTML files, sending static files, etc.</p>

<h4>4. Views</h4>
<p>Views in Express are the dynamically rendered HTML files. Express allows numerous view engines like Pug, EJS (Embedded JavaScript), Handlebars, and more. They help us to change and send out HTML on the fly.</p>

<h3 id="s-hello-world">The Mandatory Hello-World Program</h3>
<pre class="code-raw" data-lang="javascript">import express from "express";

const app = express()
const port = 3000

app.get('/', (req, res) => {
  res.send('Hello World!')
})

app.listen(port, () => {

<p>The program above is the simplest Express application, described step-by-step:</p>
<ol>
  <li>The <code>express</code> package is imported at the beginning.</li>
  <li><code>app</code> variable then initializes the Express application.</li>
  <li><code>port</code> holds the port number that the server will be hosted on.</li>
  <li><code>app.get()</code> is a router function that maps the <code>GET</code> method of the <code>/</code> URL.</li>
  <li>The callback function inside <code>app.get()</code> is a middleware function that sends a response with "Hello World" text.</li>
  <li><code>app.listen</code> is used to start the server at a given port and also takes an arrow function that logs if the server is successfully started.</li>
</ol>

<h3 id="s-summary-1">Summary</h3>
<ol>
  <li>Express is a flexible, non-strict web framework built as an extension of Node's HTTP library, adding abstractions and simplifying response methods.</li>
  <li>The client request is handled by the Express app through middlewares, flowed as Node's HTTP server request and response objects.</li>
  <li>Express has four main features:
    <ul>
      <li><strong>Routing:</strong> mapping of URL and HTTP methods</li>
      <li><strong>Middlewares:</strong> an array of functions that take a request and send a response, triggered by a router</li>
      <li><strong>Sub-applications:</strong> Different smaller applications bundled together by routes and middlewares</li>
      <li><strong>Views:</strong> Sends dynamic HTML files via templating engine</li>
    </ul>
  </li>
</ol>
`

    content: `
<p>Environment variables are variables that are specific to an individual environment. They are useful to store important information in key-value pairs outside of the source code of the project. These values are accessed by the application during runtime. These variables are mainly used for:</p>
<ul>
  <li>Providing different values for different environments like development, testing, production so that we do not have to modify our project code.</li>
  <li>Storing vital secrets such as keys, database passwords or usernames, etc.</li>
  <li>Settings for hosting like host, ports, etc.</li>
</ul>
<p>These environment variables are crucial to be hidden from hackers or leechers as they contain major information that could compromise the security of the project. The files containing these variables should never be shown to others or committed to Github.</p>

<h3 id="s-config-env">Configuring Environment Variables</h3>
<p>There are multiple ways to configure environment variables. Three methods are discussed here, mostly used during development and testing.</p>

<h4>1. OS Level Configuration</h4>
<p>The first method is using the shell command <code>export</code>, which saves environment variables to the current shell session. To overwrite any variables, just rerun <code>export</code> with new values. Variables will be lost when the shell is terminated. The <code>printenv</code> command displays all environment variables in the terminal.</p>
<pre class="code-raw" data-lang="bash">export NODE_ENV=prod PORT=3000 HOST=localhost</pre>
<blockquote><p><strong>Note:</strong> Environment variables are stored in capital snake case, called <code>SCREAMING_SNAKE_CASE</code> or <code>SHOUTING_CASE</code> with the equals sign assignment operator and no space around it.</p></blockquote>

<h4>2. Standard Node.js Configuration</h4>
<p>In Node, using the <code>dotenv</code> package is the standard way. The <code>dotenv</code> package can be installed from npm and stored as a dependency.</p>
<pre class="code-raw" data-lang="bash">npm i dotenv</pre>
<p>These variables are stored in a <code>.env</code> file in Node.js. This file is kept in the root of the project folder and must be added to <code>.gitignore</code> to limit it to your local machine.</p>
<pre class="code-raw" data-lang="text">NODE_ENV=dev
PORT=3000
HOST=localhost</pre>

<h4>3. Production Configuration</h4>
<p>The above two configurations can only be used for development, testing and local deployment purposes. <code>.env</code> files are not used in web hosting. In production, different hosting services provide dashboards that have an <code>.env</code> section where you can configure it — but always check their documentation! It can also be configured using Docker, VPS, CI/CD pipeline, etc.</p>

<h3 id="s-access-env">Accessing Environment Variables</h3>
<p>Node.js provides a built-in <code>process</code> object to access environment variables through its <code>env</code> property. Node will load each environment variable to the <code>process.env</code> object, using its name as the property. First, <code>dotenv</code> should always be loaded with its <code>config</code> method invoked.</p>
<pre class="code-raw" data-lang="javascript">import dotenv from "dotenv";
dotenv.config(/*{path: "path/to/env/file"}*/);

function required(key: string): string {
  const value = process.env[key];
  if (!value) throw new Error(\`Missing env variable: \${key}\`);
  return value;
}

export const ENV = {
  PORT: parseInt(required("PORT")),
  HOST: required("HOST"),
  NODE_ENV: process.env.NODE_ENV || "development",
};</pre>
<blockquote><p><strong>Note:</strong> The <code>.env</code> variables are always strings and no hardcoding of those values should be done in the source code.</p></blockquote>

<h3 id="s-summary-2">Summary</h3>
<ol>
  <li>Environment variables are accessed at runtime for different configuration of environments, storing important settings in key-value format.</li>
  <li>These variables are stored in a <code>.env</code> file and should never be shown to others. Also, <code>.gitignore</code> must hide it from git commits.</li>
  <li><code>export</code> is used to create and update environment variables in shell. These exist temporarily for a single terminal session.</li>
  <li>In Node.js projects, the standard approach during development is to use the <code>dotenv</code> package to load variables from a <code>.env</code> file into <code>process.env</code>.</li>
  <li>In production environments, <code>.env</code> files are typically not used directly. Instead, environment variables are configured through hosting dashboards, Docker, VPS configuration, or CI/CD pipelines.</li>
  <li>In Node.js, environment variables are accessed via the built-in <code>process.env</code> object, and since all values are strings, proper validation and type conversion should always be performed before using them.</li>
</ol>
`

    content: `
<p>Routing is the process where a server maps the HTTP verbs and URIs to specific methods that generate a response to the client request. A basic example is when we visit <code>example.com/client</code> in the browser. The raw HTTP request and the controller function look like:</p>
<pre class="code-raw" data-lang="http">GET /client HTTP/1.1</pre>
<pre class="code-raw" data-lang="javascript">app.get("/clients", function(request, response) {
  response.send("Welcome to client page");
});</pre>
<p>The request has an HTTP verb (<code>GET</code>), a URI (<code>/client</code>), and the HTTP version. The server maps the URI and HTTP method to a specific controller. The <code>app.get()</code> here has a controller function that is triggered by the server for the given request.</p>

<h3 id="s-routing-express">Routing In Express</h3>
<p>In Express.js, routing is achieved by defining routes using methods like <code>app.get()</code>, <code>app.post()</code>, <code>app.put()</code>, and <code>app.delete()</code>. Each route consists of a <strong>path</strong> and one or more <strong>handler functions</strong> (middlewares).</p>
<pre class="code-raw" data-lang="javascript">app.get("/path", function(req, res) {
  res.send("This is one of the middleware functions");
});</pre>

<h4>Grabbing Route Parameters</h4>
<p>We can pass variables in the route paths, called route parameters or path variables. In Express, this is achieved by putting a colon (<code>:</code>) in front of the variable name.</p>
<pre class="code-raw" data-lang="javascript">app.get("/clients/:cid/:dt", function(req, res) {
  let client_id = parseInt(req.params?.cid);
  let date = req.params?.dt;
  // Other code ...
});</pre>
<p>The <code>req.params</code> object maps and stores all the variables for the path, however the value is always a string type.</p>

<h4>Grabbing Query Parameters</h4>
<p>The query arguments passed through the URL after <code>?</code> are available in the query object of the request, i.e. <code>req.query</code>.</p>
<pre class="code-raw" data-lang="http">GET /search?fruit=apple</pre>
<pre class="code-raw" data-lang="javascript">app.get("/search", async function(req, res) {
  let fruitSrch = req.query?.fruit;
  // Other code...
});</pre>

<h4>Matching Route with Regular Expressions</h4>
<p>Express allows regex-based routes.</p>
<pre class="code-raw" data-lang="javascript">app.get(/^\/product\/[0-9]+$/, (req, res) => {
  res.send("Product with numeric ID");
});</pre>
<p>This matches <code>/product/123</code> but not <code>/product/abc</code>.</p>

<h3 id="s-routers">Routers</h3>
<p>Routers are the functions in Express that enable us to split routes, achieving structure in our code. Express gives flexibility to define routes from different places in the app.</p>
<p>For standard practice, routes are defined in a <code>routes</code> folder. In this project, routes for API version 1 are defined in <code>backend/src/v1/routes/</code>.</p>
<pre class="code-raw" data-lang="javascript">// app.js
import express from 'express';
import apiVersion1 from 'v1/routes/version1.js';

let app = express();

app.use("/v1/api", apiVersion1);
// app.use('/v2', apiVersion2); // if version 2

// Other code ...</pre>
<pre class="code-raw" data-lang="javascript">// v1/routes/version1.js
import { Router } from 'express';
let api = Router();

api.route("/client")
  .get(function(req, res) {
    res.send("response for /v1/api/client")
  });

export default api;</pre>

<h3 id="s-summary-3">Summary</h3>
<ol>
  <li>Routes can be mapped to a simple string or regular expressions and can have variables.</li>
  <li><code>request.params</code> &amp; <code>request.query</code> help us to get path variables and query parameters respectively in Express.</li>
  <li>Routes can be defined anywhere in Express, but it is standard to define routes inside a <code>routes</code> folder specific to version.</li>
  <li>We can split routes with the use of <code>Router</code>.</li>
</ol>
`

    id: "middlewares",

    roman: "IV.",
    sections: ["Introduction", "Controller Function", "Error Handling Middleware", "404 Handler Middleware", "Static Server Middleware", "Other Useful Middleware", "Summary"],
    content: `
<p>Middlewares are the functions core to Express as they handle requests and responses. Express helps request objects pass through an array of functions that acts as a stack for request processing, which we call the <strong>middleware stack</strong>.</p>
<p>Express executes middlewares in the order we define them. This means that the sequence we add middleware in the stack matters for a well-generated response.</p>
<p>The middleware function generally takes three arguments: <code>request</code>, <code>response</code>, and <code>next</code>. The <code>request</code> and <code>response</code> represent the HTTP request and response objects, while the <code>next</code> function passes the request processing to the next middleware in the stack.</p>

<pre class="code-raw" data-lang="javascript">const express = require('express');
const app = express();

// Custom middleware
const logger = (request, response, next) => {
  console.log(\`\${request.method} \${request.url}\`);
  next(); // pass control to next middleware
};

// Use middleware globally
app.use(logger);

// Route specific middleware
app.get('/', (request, response) => {
  response.send('Hello World');
});</pre>

<p>Every middleware function must be ended by <code>next()</code> or <code>response.end()</code>. The <code>next()</code> transfers the flow to the next middleware in the stack. The <code>response.end()</code> ends the response handling and Node bundles the response into bytes and sends it to the user.</p>
<p>If we don't use <code>next()</code> or <code>response.end()</code>, the request will hang endlessly as it is not resolved. <code>response.send()</code> or <code>response.sendFile()</code> call <code>response.end()</code> internally.</p>

<h3 id="s-controller">Controller Function</h3>
<p>For a Model-View-Controller (MVC) architecture pattern, controllers are the type of middlewares in the middleware stack that handle business logic and end with a response. This could involve working with databases, making calculations, or processing through different service functions. It mostly ends the middleware stack if no error occurred.</p>

<h3 id="s-error-middleware">Error Handling Middleware</h3>
<p>There is also a special type of middleware that handles errors. It handles all the errors that come down from other middlewares, thrown by the Express app. When a regular middleware encounters a runtime error, Express ignores all the middlewares in the stack and jumps right into the error-handling middleware.</p>
<p>The error-handling middleware function, unlike other middleware, has <strong>4 arguments</strong>: <code>error</code>, <code>request</code>, <code>response</code>, and <code>next</code>. The extra argument <code>error</code> holds the error object thrown by the previous middleware.</p>

<h3 id="s-404-middleware">404 Handler Middleware</h3>
<p>The 404 handler middleware handles routes that do not exist. It is the simplest type of middleware in Express.</p>
<pre class="code-raw" data-lang="javascript">app.use((req, res, next) => {
  res.status(404).json({
    error: "Not Found",
    message: "The requested resource could not be found."
  });
});</pre>
<p>The 404-handler middleware is kept at the last piece of middleware of the Express application. It acts as a fallback for unmatched routes.</p>

<h3 id="s-static-middleware">Static Server Middleware</h3>
<p>The static middleware serves static files such as images, CSS, JS, etc. from the server. Express has a built-in static middleware: <code>express.static()</code>.</p>
<pre class="code-raw" data-lang="javascript">// for "project/backend/public/"
const publicDir = path.resolve(__dirname, 'backend/public');
app.use(express.static(publicDir));</pre>
<p>The static middleware shares every file of the <code>backend/public/</code> folder. After each request to access public files, the server searches the public directory — if not found, it transfers to the 404 middleware without throwing an error.</p>

<h3 id="s-useful-middleware">Other Useful Middleware</h3>
<p>Beyond basic middleware usage, there are many commonly used third-party and built-in middlewares that handle specific tasks in real-world applications:</p>
<ul>
  <li><strong>Helmet:</strong> Security middleware that protects apps by setting safe HTTP headers.</li>
  <li><strong>Cors:</strong> Allows or restricts cross-origin requests when your frontend and backend run on different domains.</li>
  <li><strong>Morgan:</strong> Logs incoming requests for debugging and monitoring.</li>
  <li><strong>cookie-parser:</strong> Reads cookies, and <code>express-session</code> manages user sessions — useful for authentication systems.</li>
  <li><strong>Multer:</strong> Processes <code>multipart/form-data</code> when dealing with file uploads.</li>
  <li><strong>express-rate-limit:</strong> Prevents abuse by limiting repeated requests.</li>
</ul>

<h3 id="s-summary-4">Summary</h3>
<ol>
  <li>Middlewares are core functions in Express that handle HTTP requests and responses by forming a middleware stack through which each request passes.</li>
  <li>Express executes middlewares in the order they are defined, so proper sequencing is important.</li>
  <li>A typical middleware function has three parameters: <code>request</code>, <code>response</code>, and <code>next</code>, where <code>next()</code> passes control to the next middleware.</li>
  <li>Every middleware must either call <code>next()</code> or end the response — otherwise the request hangs.</li>
  <li>Middlewares can be applied globally using <code>app.use()</code> or to specific routes.</li>
  <li>Controller functions are specialized middlewares that contain business logic and usually terminate the request-response cycle.</li>
  <li>Error-handling middleware has four parameters and is triggered when an error occurs, skipping normal middlewares.</li>
  <li>404 handler middleware is placed at the end of the stack to handle unmatched routes.</li>
  <li>Static middleware (<code>express.static</code>) is used to serve static files from a specified directory.</li>
  <li>Common useful middlewares include: Helmet, Cors, Morgan, cookie-parser, Multer, express-rate-limit.</li>
</ol>
`
  },

    content: `
<p>In Express.js, the <code>request</code> and <code>response</code> objects form the foundation of client-server communication. Every time a client (such as a browser or API consumer) sends an HTTP request, Express creates these two objects and passes them through the middleware stack and route handlers.</p>
<p>The <code>request</code> or <code>req</code> object represents the HTTP request and has properties for the request query string, parameters, body, HTTP headers, and so on. On the other hand, the <code>response</code> or <code>res</code> object represents the HTTP response that an Express app sends when it gets an HTTP request.</p>
<p>Together, they enable developers to build dynamic web applications and APIs by handling user input and generating appropriate outputs.</p>

<h3 id="s-req-obj">Request Object</h3>
<p>The <code>request</code> object is an enhanced version of Node.js's native HTTP request object. Express extends it with additional useful properties and methods.</p>
<h4>Key Properties of Request Object</h4>
<ul>
  <li><code>req.params</code>: Contains route parameters (e.g., <code>/users/:id</code>)</li>
  <li><code>req.query</code>: Contains query string parameters (e.g., <code>/search?q=term</code>)</li>
  <li><code>req.body</code>: Contains data sent in the request body (requires middleware like JSON parser)</li>
  <li><code>req.headers</code>: Contains HTTP headers sent by the client</li>
  <li><code>req.method</code>: HTTP method used (GET, POST, PUT, DELETE)</li>
  <li><code>req.url</code> / <code>req.path</code>: The requested URL or path</li>
</ul>
<p>Request objects are immutable in terms of core structure but can be extended with custom properties. Adding new properties to <code>req</code> is a common and accepted practice.</p>

<h3 id="s-res-obj">Response Object</h3>
<p>The <code>response</code> or <code>res</code> object represents the HTTP response. Express extends Node's native response with useful methods:</p>
<ul>
  <li><code>res.send()</code>: Sends an HTTP response (string, Buffer, object, etc.)</li>
  <li><code>res.json()</code>: Sends a JSON response and sets the Content-Type header automatically.</li>
  <li><code>res.status(code)</code>: Sets the HTTP status code for the response (chainable).</li>
  <li><code>res.sendFile(path)</code>: Sends a file as an HTTP response.</li>
  <li><code>res.redirect(url)</code>: Redirects the client to the specified URL.</li>
</ul>

<h3 id="s-summary-5">Summary</h3>
<ul>
  <li>The <code>req</code> and <code>res</code> objects are the backbone of every Express handler.</li>
  <li><code>req.params</code>, <code>req.query</code>, and <code>req.body</code> are the primary ways to read incoming data.</li>
  <li><code>res.json()</code> and <code>res.send()</code> are the most common methods to send responses.</li>
  <li>Always call a response method or <code>next()</code> to avoid hanging requests.</li>
</ul>
`

    content: `
<p>Building APIs with Express is one of its primary use cases. Express's routing system maps HTTP verbs and paths to handler functions, making REST API construction straightforward and structured.</p>

<h3 id="s-http-verbs">HTTP Verbs (HTTP Methods)</h3>
<p>HTTP verbs are the types of methods that a client sends along with requests to the server. For example:</p>
<pre class="code-raw" data-lang="http">GET /olivia HTTP/1.1</pre>
<p>There are generally 4 types of methods:</p>
<ol>
  <li><strong>GET:</strong> Sends the client read-only data. It is an idempotent method.</li>
  <li><strong>POST:</strong> Creates a new record. Not for updating. Also used for adding things to cart, lists, etc.</li>
  <li><strong>PUT / PATCH:</strong> Updates existing records. PUT creates a new record if the updated record doesn't exist. Both are idempotent since a change to a record is always the same regardless of how many times it is done.</li>
  <li><strong>DELETE:</strong> Deletes existing data. Also idempotent as deleting a record always deletes the same record.</li>
</ol>
<p><em>Idempotent</em> means that the method will not change the data differently however many times it is called. These specifications are not mandatory but are a standard convention.</p>

<h3 id="s-api-versioning">API Versioning</h3>
<p>API versioning helps mitigate problems when updating the version of an API. It allows other consumers to use the API without the problem of a breaking change completely stripping them of API usage.</p>
<pre class="code-raw" data-lang="http">/v1/timezone</pre>
<p>Express can help with API versioning efficiently by making this kind of separation easy with the help of routers.</p>

<h3 id="s-summary-6">Summary</h3>
<ul>
  <li>Use <code>GET</code> for reading, <code>POST</code> for creating, <code>PUT/PATCH</code> for updating, and <code>DELETE</code> for removing.</li>
  <li>Idempotent methods (GET, PUT, DELETE) produce the same result regardless of how many times called.</li>
  <li>Use routers and URL prefixes like <code>/v1/</code> to version your APIs cleanly.</li>
</ul>
`

    content: `
<p>Express applications commonly interact with databases to persist data. This chapter covers connecting a Node.js/Express application to a MySQL database using the <code>mysql2</code> package.</p>

<h3 id="s-connecting-db">Connecting Database</h3>
<p>We need to import <code>mysql2</code> or <code>mysql2/promise</code>. The promise version creates an asynchronous connection with the database. We can use its functions asynchronously.</p>
<p>To connect to the database we can use either <code>createPool</code> or <code>createConnection</code>. <code>createConnection</code> creates a single connection to MySQL — used for simple, one-off queries. <code>createPool</code> handles multiple connections to MySQL that can be reused for multiple concurrent queries. So we will be using <code>createPool()</code>.</p>
<pre class="code-raw" data-lang="javascript">// connect.js
const { createPool } = require('mysql2/promise');

const pool = createPool({
  host: 'localhost',
  user: 'root',
  password: '1234',
  database: 'express_tut',
  connectionLimit: 10,
  queueLimit: 0,
});</pre>

<h3 id="s-testing-conn">Testing Connection</h3>
<p>We use the <code>getConnection()</code> method of the pool object to retrieve a connection with the database. We also need to use the <code>release()</code> method to transfer the connection back to the pool.</p>
<pre class="code-raw" data-lang="javascript">const testConnection = async function() {
  try {
    const connection = await pool.getConnection();
    console.log('✅ Database connected!');
    connection.release(); // Important: release connection back to pool
    return true;
  } catch (error) {
    console.error('❌ Database connection error:', error.message);
    return false;
  }
}

testConnection();</pre>
<blockquote><p><strong>Note:</strong> Keep this file as <code>db.js</code> in <code>project_folder/config/</code>.</p></blockquote>

<h3 id="s-crud">CRUD Operations</h3>
<p>In the <code>models/</code> folder we create asynchronous functions that handle CRUD operations in the database.</p>
<pre class="code-raw" data-lang="javascript">const { pool } = require('../config/db');

const getAllTaskDB = async () => {
  let sqlQuery = 'SELECT * FROM Tasks;'
  try {
    let [result] = await pool.execute(sqlQuery);
    return result;
  } catch (err) {
    console.log('getAllTaskDB err:', err);
    throw err;
  }
}

const getTaskDB = async (task_id) => {
  let sqlQuery = 'SELECT * FROM Tasks WHERE id = ?'
  try {
    let result = await pool.execute(sqlQuery, [task_id]);
    return (result[0].length > 0) ? result[0] : null;
  } catch (err) {
    console.error('getTaskDB err:', err);
    throw err;
  }
};

const createTaskDB = async (name, completed) => {
  let sqlQuery = 'INSERT INTO Tasks(name, completed) VALUES (?,?)'
  try {
    let result = await pool.execute(sqlQuery, [name, completed]);
    return result;
  } catch (err) {
    console.log('createTaskDB err: ', err);
    throw err;
  }
};</pre>

<p>Here we used <code>pool.execute()</code> instead of <code>pool.query()</code>. The main difference:</p>
<ul>
  <li><strong><code>execute()</code></strong>: Prepares the statement first — uses parameterized input, prevents SQL injection, can be cached and reused. Better for security and performance with repeated queries.</li>
  <li><strong><code>query()</code></strong>: Executes without preparing — efficient for static queries but cannot be cached or reused.</li>
</ul>

<h3 id="s-summary-7">Summary</h3>
<ul>
  <li>We use <code>mysql2</code> or <code>mysql2/promise</code> packages.</li>
  <li><code>pool = createPool({...})</code> creates a pool of concurrent connections with the database, used to handle multiple queries.</li>
  <li><code>connection = pool.getConnection()</code> retrieves a connection with the database. <code>connection.release()</code> releases it back to the pool.</li>
  <li><code>pool.query()</code> executes SQL statically — does not provide parameter binding.</li>
  <li><code>pool.execute()</code> prepares SQL first — query can be cached and reused, better for security and performance.</li>
</ul>
`

    sections: ["Introduction", "Signing JWT", "Verifying JWT", "JWT Usage", "Summary"],
    content: `
<p>JWT stands for JSON Web Token. It is an open standard used for securely transmitting information between parties as a JSON object. Typically used for authentication and authorization, a JWT consists of three parts:</p>
<ol>
  <li><strong>Header:</strong> Contains information about the token — specifies token type (jwt) and signing algorithm.</li>
  <li><strong>Payload:</strong> Contains the main data that is transmitted.</li>
  <li><strong>Signature:</strong> Created by taking the encoded header and payload and signing with a secret key. Ensures the data is not tampered with.</li>
</ol>
<p>We use the package <code>jsonwebtoken</code> with methods such as <code>sign()</code> to create a new token and <code>verify()</code> to verify the token.</p>

<h3 id="s-sign-jwt">Signing JWT</h3>
<p>Signing JWT means creating a new token. It is done by the <code>sign()</code> method of the <code>jsonwebtoken</code> package. The method takes 3 arguments: payload data, secret key, and other options like expiry time.</p>
<pre class="code-raw" data-lang="javascript">const jwt = require("jsonwebtoken");
const SECRET_KEY = "Nepal";

const generateAccessToken = function(userEmail) {
  return jwt.sign({ user_email: userEmail }, SECRET_KEY, { expiresIn: "2h" });
};</pre>

<h3 id="s-verify-jwt">Verifying JWT</h3>
<p>We can verify a JWT token by the <code>verify()</code> method of the <code>jsonwebtoken</code> package. It takes 2 required arguments: token string and secret key.</p>
<pre class="code-raw" data-lang="javascript">const verified = jwt.verify(token, SECRET_KEY);</pre>
<p>It works synchronously. It returns the decoded payload data or throws an error if it couldn't verify the token. The method can also use a callback function for asynchronous operation:</p>
<pre class="code-raw" data-lang="javascript">jwt.verify(token, "Nepal", (err, decoded) => {
  if (err) {
    console.log("jwt error:", err);
  } else {
    console.log("payload:", decoded);
  }
});</pre>
<blockquote><p><strong>Note:</strong> The asynchronous <code>verify()</code> method is not promise-based so we don't need to use the <code>await</code> keyword. It's better to use the synchronous <code>verify()</code> for simpler code.</p></blockquote>

<h3 id="s-jwt-usage">JWT Usage</h3>
<p>We use a 2-token strategy for JWT: an <strong>access token</strong> and a <strong>refresh token</strong>. These tokens help manage user authentication for API requests.</p>
<ul>
  <li><strong>Access Token:</strong> Used to authenticate API requests and access protected resources. It typically contains the necessary user information and permissions (claims) needed to authorize a request. They are short-lived. The user sends it in each API request to authenticate itself.</li>
  <li><strong>Refresh Token:</strong> Used for generating a new access token if the current one is expired or lost — without requiring the user to re-authenticate. It is long-lived and stored in an HTTP-only cookie with <code>secure</code> enabled. We store the refresh token in the database for a more secure server.</li>
</ul>

<h3 id="s-summary-8">Summary</h3>
<ol>
  <li>JWT is used for securely transmitting data across the network by encoding the data with a secret key.</li>
  <li><code>jwt.sign({payload}, SECRET_KEY, {options})</code> is used to create a new token.</li>
  <li><code>jwt.verify('token-string', SECRET_KEY, options/callback)</code> checks the token for its authenticity.</li>
  <li><code>verify()</code> works synchronously for 2 arguments, but if we use a 3rd argument callback, it works asynchronously (not promise-based).</li>
  <li>We use an access token to authenticate the user for each request, while the refresh token regenerates the access token if it is lost or expired.</li>
</ol>
`

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentView = 'toc'; // 'toc' | chapter index
let theme = localStorage.getItem('theme') || 'light';

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(theme);
  buildTOC();
  buildChapters();
  updateNav();
});

function openBook() {
  const cover = document.getElementById('cover-screen');
  cover.classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  setTimeout(() => cover.style.display = 'none', 650);
}

document.getElementById('cover-screen').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') openBook();
});

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', theme);
  applyTheme(theme);
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
}

// ── TOC ───────────────────────────────────────────────────────────────────────
function buildTOC() {
  const list = document.getElementById('toc-list');
  CHAPTERS.forEach((ch, i) => {
    const li = document.createElement('li');
    li.className = 'toc-chapter-item';
    li.innerHTML = `<a class="toc-chapter-link" onclick="goToChapter(${i})" role="button" tabindex="0">
      <span class="toc-num">${ch.roman}</span>
      <span class="toc-name">${ch.title}</span>
      <span class="toc-dots"></span>
      <span class="toc-page-num">${i + 1}</span>
    </a>`;
    list.appendChild(li);

    ch.sections.forEach(sec => {
      const si = document.createElement('li');
      si.className = 'toc-section-item';
      const secId = sectionId(sec, i);
      si.innerHTML = `<a class="toc-section-link" onclick="goToChapter(${i}, '${secId}')" role="button" tabindex="0">${sec}</a>`;
      list.appendChild(si);
    });
  });

  // keyboard support
  list.querySelectorAll('[tabindex="0"]').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.click(); });
  });
}

function sectionId(sectionName, chIdx) {
  return 's-' + sectionName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
}

// ── BUILD CHAPTERS ────────────────────────────────────────────────────────────
function buildChapters() {
  const area = document.getElementById('chapters-area');
  CHAPTERS.forEach((ch, i) => {
    const page = document.createElement('div');
    page.className = 'chapter-page';
    page.id = `chapter-${i}`;

    const minimap = ch.sections.length > 0 ? `
      <aside class="minimap" id="minimap-${i}" aria-label="Chapter sections">
        <div class="minimap-label">In This Chapter</div>
        <ul class="minimap-list">
          ${ch.sections.map(sec => {
            const id = sectionId(sec, i);
            return `<li class="minimap-item"><a class="minimap-link" data-target="${id}" onclick="scrollToSection('${id}', ${i})">${sec}</a></li>`;
          }).join('')}
        </ul>
      </aside>` : '';

    page.innerHTML = `
      <div class="chapter-paper">
        <div class="chapter-number-label">${ch.roman !== '—' ? 'Chapter ' + ch.roman : ''}</div>
        <h2 class="chapter-title">${ch.title}</h2>
        <div class="chapter-body" id="body-${i}">
          ${processContent(ch.content)}
        </div>
        <div class="chapter-nav-bar">
          <button class="ch-nav-btn" onclick="prevChapter()" ${i === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="ch-nav-btn" onclick="nextChapter()" ${i === CHAPTERS.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>
      </div>
      ${minimap}
    `;

    area.appendChild(page);

    // attach copy buttons after insert
    page.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pre = btn.closest('.code-block-wrap').querySelector('pre');
        navigator.clipboard.writeText(pre.innerText).then(() => {
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        });
      });
    });
  });

  // IntersectionObserver for minimap active state
  setupMinimapObserver();
}

function processContent(html) {
  // Convert <pre class="code-raw" data-lang="..."> blocks into styled code blocks
  return html.replace(/<pre class="code-raw" data-lang="([^"]*)">([\s\S]*?)<\/pre>/g, (match, lang, code) => {
    const escaped = code.trim()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    const highlighted = highlight(escaped, lang);
    return `<div class="code-block-wrap">
      <div class="code-block-header">
        <span class="code-lang">${lang || 'code'}</span>
        <button class="copy-btn" type="button">Copy</button>
      </div>
      <pre><code>${highlighted}</code></pre>
    </div>`;
  });
}

// Minimal syntax highlighter
function highlight(code, lang) {
  if (!lang || lang === 'text' || lang === 'http') return code;

  let c = code;
  // comments
  c = c.replace(/(\/\/[^\n]*)/g, '<span class="tok-comment">$1</span>');
  c = c.replace(/(#[^\n]*)/g, '<span class="tok-comment">$1</span>');

  // strings
  c = c.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|`[^`]*`)/g, '<span class="tok-string">$1</span>');

  // keywords
  const kw = /\b(import|export|from|const|let|var|function|async|await|return|if|else|try|catch|throw|new|class|extends|this|typeof|require|default|null|undefined|true|false)\b/g;
  c = c.replace(kw, '<span class="tok-keyword">$1</span>');

  // numbers
  c = c.replace(/\b(\d+)\b/g, '<span class="tok-number">$1</span>');

  // function calls
  c = c.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)\s*\(/g, '<span class="tok-func">$1</span>(');

  return c;
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function showTOC() {
  currentView = 'toc';
  document.getElementById('toc-page').style.display = '';
  document.getElementById('chapters-area').classList.remove('visible');
  updateNav();
  window.scrollTo(0, 0);
}

function goToChapter(idx, sectionTarget) {
  // hide all chapters
  document.querySelectorAll('.chapter-page').forEach(p => p.classList.remove('active'));

  document.getElementById('toc-page').style.display = 'none';
  document.getElementById('chapters-area').classList.add('visible');
  document.getElementById(`chapter-${idx}`).classList.add('active');

  currentView = idx;
  updateNav();
  window.scrollTo(0, 0);

  if (sectionTarget) {
    setTimeout(() => {
      const el = document.getElementById(sectionTarget);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function prevChapter() {
  if (currentView === 'toc') return;
  if (currentView === 0) { showTOC(); return; }
  goToChapter(currentView - 1);
}

function nextChapter() {
  if (currentView === 'toc') { goToChapter(0); return; }
  if (currentView < CHAPTERS.length - 1) goToChapter(currentView + 1);
}

function scrollToSection(id, chIdx) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateNav() {
  const nameEl = document.getElementById('nav-chapter-name');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  if (currentView === 'toc') {
    nameEl.textContent = 'Table of Contents';
    prevBtn.disabled = true;
    nextBtn.disabled = false;
    nextBtn.textContent = 'Chapter 1 →';
  } else {
    const ch = CHAPTERS[currentView];
    nameEl.textContent = ch.title;
    prevBtn.disabled = false;
    nextBtn.disabled = currentView >= CHAPTERS.length - 1;
    prevBtn.textContent = currentView === 0 ? '← Contents' : '← Prev';
    nextBtn.textContent = 'Next →';
  }
}

// ── MINIMAP OBSERVER ──────────────────────────────────────────────────────────
function setupMinimapObserver() {
  if (!window.IntersectionObserver) return;

  CHAPTERS.forEach((ch, i) => {
    const body = document.getElementById(`body-${i}`);
    if (!body) return;
    const headings = body.querySelectorAll('h3[id]');
    if (!headings.length) return;

    const links = document.querySelectorAll(`#minimap-${i} .minimap-link`);

    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          const active = document.querySelector(`#minimap-${i} [data-target="${entry.target.id}"]`);
          if (active) active.classList.add('active');
        }
      });
    }, { rootMargin: '-60px 0px -60% 0px', threshold: 0 });

    headings.forEach(h => obs.observe(h));
  });
}
</script>
